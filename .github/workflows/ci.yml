name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Python Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        run: |
          pytest bt_lib/tests/ -v --cov=bt_lib --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy

      - name: Run ruff
        run: |
          ruff check bt_lib/ visualizer/
          ruff format --check bt_lib/ visualizer/

      - name: Run mypy
        run: |
          mypy bt_lib/ --ignore-missing-imports

  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify package imports
        run: |
          python -c "from bt_lib import Sequence, Selector, Action, Condition, Blackboard, BehaviorTree; print('Core imports OK')"
          python -c "from bt_lib.parser import parse_xml, parse_json, parse_yaml; print('Parser imports OK')"
          python -c "from bt_lib.runner import run_tree_file; print('Runner imports OK')"

      - name: Verify examples parse
        run: |
          python -c "
          from bt_lib.parser import parse_xml_file
          for f in ['examples/simple.xml', 'examples/patrol.xml', 'examples/pickup.xml']:
              root = parse_xml_file(f)
              print(f'{f}: {root.name} ({type(root).__name__})')
          "

      - name: Run example trees
        run: |
          python -m bt_lib.runner examples/simple.xml
          python -m bt_lib.runner examples/patrol.xml --blackboard BatteryLow=true
          python -m bt_lib.runner examples/pickup.xml
          echo "All examples run successfully"

  deploy-docs:
    name: Deploy Docs (Main Branch)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build documentation
        run: |
          echo "Documentation deployment placeholder"
          # Add Sphinx/MkDocs build here when docs are added